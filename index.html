<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Resilient Sheet</title></head>
<body>
<p id="status">Loading sheet...</p>
<script>
const parts = ["aa","ab","ac","ad","ae"];
Promise.all(parts.map(p => fetch("parts/" + p).then(r => { if (!r.ok) throw new Error(p); return r.text(); })))
  .then(chunks => { document.open(); document.write(chunks.join("")); document.close(); })
  .catch(err => { document.getElementById("status").textContent = "Could not load sheet parts: " + err; });
</script>
</body>
</html>
