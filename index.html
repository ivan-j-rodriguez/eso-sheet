<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resilient Sheet</title>
<style>body{margin:0;background:#05080f;color:#e7eefc;font-family:Segoe UI,sans-serif}header,section{padding:12px;border-bottom:1px solid #1e3a5f}h1{margin:0;font-size:22px}label{display:block;color:#8ea4c8;font-size:12px;margin:8px 0 4px}select,input{width:100%;background:#121c2e;color:#e7eefc;border:1px solid #1e3a5f;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#121c2e;border:1px solid #1e3a5f;border-radius:10px;padding:8px;margin:6px 0}.log{white-space:pre-wrap;color:#8ea4c8;font-size:12px;max-height:240px;overflow:auto}</style></head>
<body><header><h1>Resilient Sheet</h1><p id="status">Loading set files...</p></header>
<section><div class="grid"><div><label>Race</label><select id="race"></select></div><div><label>Food</label><select id="food"></select></div></div>
<div class="grid"><div><label>Health</label><input id="ah" type="number" value="0"></div><div><label>Magicka</label><input id="am" type="number" value="64"></div></div>
<label>Stamina</label><input id="as" type="number" value="0">
<div class="grid"><div><label>Curse</label><select id="curse"><option>None</option><option>Vampire</option></select></div><div><label>Vampire stage</label><select id="vstage"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>
<label>Light / medium / heavy pieces</label><div class="grid"><input id="light" type="number" value="5"><input id="med" type="number" value="2"></div><input id="heavy" type="number" value="0">
<label>Set</label><select id="set"></select><label>Pieces of that set</label><input id="pieces" type="number" value="5">
<label>Precision / Piercing / Fighting Finesse stages</label><div class="grid"><input id="prec" type="number" value="2"><input id="piercing" type="number" value="2"></div><input id="ff" type="number" value="2">
</section><section id="stats"></section><section class="log" id="log"></section>
<script>
const RACES={"High Elf":{mag:2000},"Dark Elf":{wd:258},"Khajiit":{crit:915},"Argonian":{hp:1000},"Breton":{mag:2000},"None":{}};
const FOOD={"None":{},"Jugged Rabbit in Preserves":{hp:4462,mag:4105,stam:4105},"Capon Tomato-Beet Casserole":{hp:4462,mag:4105,stam:4105},"Longfin Pasty with Melon Sauce":{hp:4462,mag:4105,stam:4105},"Potentate's Supreme Cioppino":{hp:4200,mag:3864,stam:3864}};
let SETS=[];
function n(id){return Number(document.getElementById(id).value)||0}
function fill(id,keys){const s=document.getElementById(id);s.innerHTML="";keys.forEach(k=>{const o=document.createElement("option");o.textContent=k;s.appendChild(o)})}
fill("race",Object.keys(RACES));fill("food",Object.keys(FOOD));
function flats(line){const out={};if(/while|when you|after you|whenever/i.test(line)&&!/at all times/i.test(line))return out;const g=(re,k)=>{const m=line.match(re);if(m)out[k]=(out[k]||0)+Number(m[1])};g(/Adds (\d+) Maximum Health/i,"hp");g(/Adds (\d+) Maximum Magicka/i,"mag");g(/Adds (\d+) Maximum Stamina/i,"stam");g(/Adds (\d+) Weapon and Spell Damage/i,"wd");g(/Adds (\d+) Critical Chance/i,"crit");g(/Adds (\d+) Offensive Penetration/i,"pen");g(/Adds (\d+) Armor/i,"phys");const cd=line.match(/Critical Damage(?: and Healing)? by (\d+)%/i);if(cd)out.critDmg=Number(cd[1]);return out}
function calc(){let hp=16000+n("ah")*122,mag=12000+n("am")*111,stam=12000+n("as")*111,crit=n("prec")*160,pen=n("piercing")*350,wd=1000,critDmg=50+n("ff")*4;const race=RACES[document.getElementById("race").value]||{};hp+=race.hp||0;mag+=race.mag||0;wd+=race.wd||0;crit+=race.crit||0;const food=FOOD[document.getElementById("food").value]||{};hp+=food.hp||0;mag+=food.mag||0;stam+=food.stam||0;const light=n("light"),med=n("med"),heavy=n("heavy");pen+=light*939;crit+=light*219;wd=Math.round(wd*(1+0.02*med));critDmg+=med*2;const set=SETS.find(s=>s.name===document.getElementById("set").value);const have=n("pieces");const notes=[];if(set)set.lines.forEach(line=>{const need=Number((line.match(/\((\d+)/)||[])[1]||0);if(have<need)return;const f=flats(line);hp+=f.hp||0;mag+=f.mag||0;stam+=f.stam||0;wd+=f.wd||0;crit+=f.crit||0;pen+=f.pen||0;critDmg+=f.critDmg||0;notes.push(line)});let curse="";if(document.getElementById("curse").value==="Vampire"){const stage=n("vstage");curse="Vampire stage "+stage+" health recovery -"+[0,10,30,60,100][stage]+"%";}document.getElementById("stats").innerHTML=`<div class="stat">Health <b>${hp}</b></div><div class="stat">Magicka <b>${mag}</b></div><div class="stat">Stamina <b>${stam}</b></div><div class="stat">Weapon / spell damage <b>${wd}</b></div><div class="stat">Crit rating <b>${crit}</b> (${(crit/219).toFixed(1)}%)</div><div class="stat">Penetration <b>${pen}</b></div><div class="stat">Crit damage <b>${critDmg}%</b></div>`;document.getElementById("log").textContent=[curse].concat(notes).filter(Boolean).join("\n")}
document.body.addEventListener("change",calc);
const base="https://raw.githubusercontent.com/ivan-j-rodriguez/eso-sheet/main/sets/sets-";
Promise.all(Array.from({length:84},(_,i)=>fetch(base+String(i).padStart(2,"0")+".json").then(r=>r.ok?r.json():[]).catch(()=>[]))).then(parts=>{SETS=parts.flat();fill("set",["None"].concat(SETS.map(s=>s.name)));document.getElementById("status").textContent=SETS.length+" sets loaded from the repo files.";calc()});
</script></body></html>
